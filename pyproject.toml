[project]
name = "rental-law-navigator"
version = "0.1.0"
description = "Deterministic rental housing law navigator"
requires-python = ">=3.12"
dependencies = [
  "anthropic",
  "jsonschema",
  "pydantic>=2",
  "python-dateutil",
  "pyyaml",
  "rapidfuzz",
  "requests",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/navigator"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
